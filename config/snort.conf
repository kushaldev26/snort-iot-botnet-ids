##############################################################################
#  SNORT 2.9.x CONFIGURATION FILE
#  Project  : CSL-I09 B.Tech Cyber Security Lab Mini Project
#  Title    : Snort Rules for IoT Botnet Attacks (Mirai / Bashlite family)
#  Student  : Kushal Kumar  |  Roll: 23ESKCY026
#  Institute: SKIT Jaipur
#  Date     : 2024-2025
#
#  DISCLAIMER: This configuration is for EDUCATIONAL / LAB USE ONLY.
#  All IP addresses are RFC-1918 private ranges used inside a closed
#  VirtualBox host-only network (192.168.56.0/24). No traffic is
#  generated toward or monitored on live production networks.
##############################################################################

###########################################################################
# SECTION 1 – NETWORK VARIABLES
###########################################################################

# The subnet that contains our simulated IoT lab environment
var HOME_NET 192.168.56.0/24

# Everything outside the lab is treated as potentially external/hostile
var EXTERNAL_NET !$HOME_NET

# ----- Individual node IP variables (lab topology) ----------------------
# Legitimate administrator workstation
ipvar ADMIN_HOST    192.168.56.5

# Target IoT IP camera (Telnet:23/2323, HTTP:80, SSH:22)
ipvar IOT_CAMERA    192.168.56.10

# Target Smart Home MQTT gateway (MQTT:1883)
ipvar MQTT_GATEWAY  192.168.56.11

# Simulated Mirai bot / brute-force attacker node
ipvar MIRAI_BOT     192.168.56.100

# Secondary port-scanner node
ipvar PORT_SCANNER  192.168.56.105

# Group of attacker nodes (used in some rules)
ipvar ATTACKER_HOSTS [192.168.56.100,192.168.56.105]

###########################################################################
# SECTION 2 – PATH VARIABLES
###########################################################################

# Directory that holds the custom rule files (relative to this config)
var RULE_PATH       ../rules

# Directory where Snort writes alerts and logs
var LOG_PATH        ../results

# Enable Unified2 alert logging (1 = on)
var ALERT_UNIFIED_LOG 1

# Path to Snort-supplied rule/classification/reference files
# Adjust to your actual Snort installation prefix if needed
var SO_RULE_PATH    /etc/snort/so_rules
var PREPROC_RULE_PATH /etc/snort/preproc_rules
var WHITE_LIST_PATH /etc/snort/rules
var BLACK_LIST_PATH /etc/snort/rules

###########################################################################
# SECTION 3 – PORT GROUP VARIABLES
###########################################################################

# Ports on which IoT Telnet services are expected
portvar TELNET_PORTS [23,2323]

# Standard HTTP port for the camera's web interface
portvar HTTP_PORTS  [80,8080,8888]

# SSH port on the camera
portvar SSH_PORTS   [22]

# MQTT broker port on the smart-home gateway
portvar MQTT_PORTS  [1883,8883]

# A combined set of all IoT service ports (used by sfportscan / stream5)
portvar IOT_PORTS   [22,23,80,1883,2323,8080,8883]

###########################################################################
# SECTION 4 – DECODER CONFIGURATION
###########################################################################

# Disable oversized IP/TCP options warnings (they flood logs in lab)
config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts
config disable_ipopt_alerts

# Set the internal packet buffer; default 1518 is fine for lab captures
config snaplen: 1518

# Checksum validation: none for lab captures from PCAP replay
config checksum_mode: none

# Default TTL (some IoT devices send with low TTL)
config min_ttl: 1

###########################################################################
# SECTION 5 – PREPROCESSORS
###########################################################################

# ---- 5a. frag3 (IP defragmentation) ------------------------------------
# Handles fragmented IP packets that might be used to evade detection.
# Using the "linux" policy because most embedded IoT firmware uses Linux.
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy linux, detect_anomalies, \
    overlap_limit 10, min_fragment_length 100, timeout 180

# ---- 5b. stream5 (stateful TCP/UDP/ICMP tracking) ----------------------
# Tracks sessions on all IoT-relevant ports for accurate content matching.
preprocessor stream5_global: \
    track_tcp yes, \
    track_udp yes, \
    track_icmp no, \
    max_tcp 262144, \
    max_udp 131072, \
    flush_on_alert yes, \
    prune_log_max 0

preprocessor stream5_tcp: \
    policy linux, \
    detect_anomalies, \
    require_3whs 0, \
    overlap_limit 10, \
    small_segments 3 bytes 150, \
    timeout 180, \
    ports client [23 2323 80 22 1883 8080 8883], \
    ports both [23 2323 80 22 1883]

preprocessor stream5_udp: \
    timeout 180

# ---- 5c. http_inspect (HTTP normalisation for camera web interface) -----
preprocessor http_inspect: global \
    iis_unicode_map /etc/snort/unicode.map 1252, \
    compress_depth 65535, \
    decompress_depth 65535

preprocessor http_inspect_server: server default \
    http_methods { GET POST PUT DELETE HEAD OPTIONS CONNECT TRACE } \
    profile all \
    ports { 80 8080 8888 } \
    server_flow_depth 0 \
    client_flow_depth 0 \
    post_depth -1 \
    oversize_dir_length 500 \
    max_header_length 750 \
    max_headers 100 \
    normalize_utf yes \
    unlimited_decompress yes \
    enable_cookie yes \
    extract_gzip yes \
    inspect_gzip yes \
    non_strict

# ---- 5d. sfportscan (port-scan detection) ------------------------------
# Detects the rapid SYN sweeps characteristic of Mirai scanning phase.
preprocessor sfportscan: \
    proto  { tcp udp icmp ip } \
    scan_type { portscan portsweep decoy_portscan distributed_portscan } \
    sense_level { medium } \
    watch_ip  !$HOME_NET \
    ignore_scanners { } \
    ignore_scanned  { } \
    logfile $LOG_PATH/portscan.log \
    include_midstream

# ---- 5e. SMTP preprocessor (future-proofing) ---------------------------
preprocessor smtp: \
    ports { 25 465 587 } \
    inspection_type stateful \
    normalize cmds \
    normalize_cmds { EXPN VRFY RCPT }

# ---- 5f. DNS preprocessor ----------------------------------------------
preprocessor dns: \
    ports { 53 } \
    enable_rdata_overflow

###########################################################################
# SECTION 6 – OUTPUT MODULES
###########################################################################

# ---- 6a. alert_fast: human-readable single-line alert log --------------
# Each alert goes to ../results/alert.ids for easy grepping in lab.
output alert_fast: $LOG_PATH/alert.ids

# ---- 6b. log_pcap: write matching packets to PCAP for Wireshark --------
output log_pcap: $LOG_PATH/snort_captures.pcap

# ---- 6c. unified2: binary log consumed by Barnyard2 / BASE / Snorby ----
output unified2: filename $LOG_PATH/snort.log, limit 128, nostamp

# ---- 6d. alert_syslog: forward alerts to syslog (optional in lab) ------
# output alert_syslog: host=127.0.0.1:514, LOG_AUTH LOG_ALERT

###########################################################################
# SECTION 7 – RULE CONFIGURATION
###########################################################################

# Use the "balanced" rule set for a reasonable false-positive rate
config policy_mode: inline

# Classification definitions (shipped with Snort)
include /etc/snort/classification.config

# Reference URI definitions
include /etc/snort/reference.config

###########################################################################
# SECTION 8 – THRESHOLD / SUPPRESSION
###########################################################################

# Global threshold to avoid alert storms during brute-force simulation.
# Individual rule thresholds are set per-rule in local.rules.
# suppress list can be added here for known-good admin traffic.
# suppress gen_id 1, sig_id 1000001, track by_src, ip 192.168.56.5

###########################################################################
# SECTION 9 – RULE INCLUDES
###########################################################################

# --- Lab-specific IoT Botnet detection rules (PRIMARY FOCUS) ------------
include $RULE_PATH/local.rules

# --- Uncomment below to also load Snort Community / VRT rules -----------
# include $RULE_PATH/community.rules
# include $RULE_PATH/snort3-community.rules

##############################################################################
# END OF snort.conf
##############################################################################
